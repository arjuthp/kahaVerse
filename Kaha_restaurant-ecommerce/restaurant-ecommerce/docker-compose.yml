version: "3"

services:
  postgres:
    image: postgis/postgis:latest
    env_file:
      - .postgres_env
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  restaurant-ecommerce:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3005:3005"
    depends_on:
      - postgres
    volumes:
      - ./:/restaurant-ecommerce

volumes:
  postgres_data:
